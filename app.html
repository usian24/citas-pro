  <script>
    function actualizarPreviewDescuento() {
      if (typeof money !== 'function') return;
      const precio = parseFloat(document.getElementById('prod-price').value) || 0;
      const desc = parseFloat(document.getElementById('prod-discount').value) || 0;
      const preview = document.getElementById('prod-discount-preview');
      if (desc > 0 && precio > 0) {
        const final = (precio * (1 - desc / 100)).toFixed(2);
        preview.textContent = `El cliente verá: ${money(precio)} → ${money(final)} (-${Math.round(desc)}%)`;
      } else {
        preview.textContent = '';
      }
    }

    function abrirTiendaSegura() {
      if (window.location.hash && window.location.hash.includes('#b/')) {
        window.location.href = 'tienda.html' + window.location.hash;
        return;
      }
      let nombreBarberia = document.getElementById('bp-name').innerText;
      let baseDatos = window.DB || (typeof loadDB === 'function' ? loadDB() : null);
      if (baseDatos && baseDatos.businesses) {
        let negocio = baseDatos.businesses.find(b => b.name === nombreBarberia);
        if (negocio) {
          window.location.href = 'tienda.html#b/' + negocio.id;
          return;
        }
      }
      if (typeof CUR !== 'undefined' && CUR && CUR.id) {
        window.location.href = 'tienda.html#b/' + CUR.id;
        return;
      }
      alert("Error: No pudimos identificar la barbería para abrir la tienda.");
    }
  </script>

    /* ══════════════════════════
       IDIOMA (Traducción Invisible)
    ══════════════════════════ */
    function initGoogleTranslate() {
      var div = document.createElement('div');
      div.id = 'google_translate_element';
      div.style.position = 'absolute';
      div.style.opacity = '0';
      div.style.zIndex = '-999';
      document.body.appendChild(div);

      var script = document.createElement('script');
      script.type = 'text/javascript';
      script.src = 'https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';
      document.body.appendChild(script);

      window.googleTranslateElementInit = function () {
        new google.translate.TranslateElement({ pageLanguage: 'es', includedLanguages: 'en,es', autoDisplay: false }, 'google_translate_element');
        setTimeout(function () {
          var savedLang = localStorage.getItem('citaspro_lang');
          if (!savedLang) {
            localStorage.setItem('citaspro_lang', 'es');
            savedLang = 'es';
          }
          if (savedLang && savedLang === 'en') {
            window.changeLanguage('en');
          }
          window.syncLanguageToggles();
        }, 1000);
      };
    }

    window.syncLanguageToggles = function () {
      var isEn = localStorage.getItem('citaspro_lang') === 'en';
      document.querySelectorAll('.lang-toggle').forEach(function (t) {
        if (isEn) t.classList.add('on');
        else t.classList.remove('on');
        if (t.tagName === 'BUTTON') t.textContent = isEn ? 'ES' : 'EN';
      });
    };

    window.toggleLanguage = function (el) {
      var isEn = el.classList.toggle('on');
      window.changeLanguage(isEn ? 'en' : 'es');
      document.querySelectorAll('.lang-toggle').forEach(function (t) {
        if (t !== el) t.classList[isEn ? 'add' : 'remove']('on');
        if (t.tagName === 'BUTTON') t.textContent = isEn ? 'ES' : 'EN';
      });
    };

    window.changeLanguage = function (langCode) {
      var selectField = document.querySelector("select.goog-te-combo");
      if (selectField) {
        selectField.value = langCode;
        selectField.dispatchEvent(new Event("change"));
        localStorage.setItem('citaspro_lang', langCode);
      } else {
        setTimeout(function () { window.changeLanguage(langCode); }, 500);
      }
    };

    initGoogleTranslate();
  </script>
